# Main pipeline: на каждый пуш в main -- воспроизводимая сборка, автотесты
# и сохранение build artifact (Windows-сборка игры, хранится 14 дней).
name: Main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read   # gitleaks в PR читает список коммитов через API
  checks: write

jobs:
  checks:
    uses: ./.github/workflows/_checks.yml
    secrets: inherit

  unity-tests:
    needs: checks
    uses: ./.github/workflows/_unity-tests.yml
    with:
      require-license: true
    secrets: inherit

  build-windows:
    needs: unity-tests
    uses: ./.github/workflows/_unity-build.yml
    with:
      target: StandaloneWindows64
      retention-days: 14
    secrets: inherit
